global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'geo-ai-medallion'
    environment: 'development'

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  - job_name: 'geoai-pipeline'
    static_configs:
      - targets: ['geoai-metrics:8888']
    metrics_path: '/metrics'
    scrape_interval: 30s

remote_write:
  - url: http://localhost:9090/api/v1/write
    queue_config:
      max_shards: 3