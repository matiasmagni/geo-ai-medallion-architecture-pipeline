global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'geo-ai-medallion'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  - job_name: 'geoai-pipeline'
    static_configs:
      - targets: ['host.docker.internal:8888']
    metrics_path: '/metrics'

  - job_name: 'spark'
    static_configs:
      - targets: ['spark-master:4040']
    metrics_path: '/metrics'

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'

rule_files: []

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

remote_write:
  - url: http://localhost:9090/api/v1/write
    queue_config:
      capacity: 10000
      max_shards: 5
      min_shards: 1
      max_samples_per_send: 500