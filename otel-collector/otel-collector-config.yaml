receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  jaeger:
    protocols:
      thrift_http:
        endpoint: 0.0.0.0:14268
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  transform:
    statements:
      - replace_pattern(attributes["http.target"], "^/v1/metrics$", "/metrics")

  attributes:
    actions:
      - key: environment
        value: development
        action: insert
      - key: service.name
        value: geo-ai-pipeline
        action: insert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel
    const_labels:
      service: geo-ai-pipeline

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      attributes:
        - service.name
        - layer
        - operation

  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  otlp:
    endpoint: http://jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp, jaeger]
      processors: [batch, memory_limiter, attributes]
      exporters: [prometheus, loki, jaeger]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, memory_limiter]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [loki]

  telemetry:
    logs:
      level: info