# =============================================================================
# GeoAI Medallion Architecture - Local Development Stack
# =============================================================================

services:
  # =========================================================================
  # MINIO - Object Storage
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: geoai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - geoai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================================================
  # SPARK (Local Standalone)
  # =========================================================================
  spark:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: geoai-spark
    environment:
      SPARK_MODE: master
      SPARK_MASTER_PORT: 7077
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      S3_ENDPOINT: http://minio:9000
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
    command: ["sh", "-c", "chmod +x /start-spark.sh && /start-spark.sh"]
    ports:
      - "9077:7077"
      - "9080:8080"
      - "4040:4040"
    volumes:
      - ./src:/home/jovyan/src
      - ./tests:/home/jovyan/tests
      - ./start-spark.sh:/start-spark.sh
    networks:
      - geoai-network
    depends_on:
      - minio

  # =========================================================================
  # POSTGRESQL - Metastore
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: geoai-postgres
    environment:
      POSTGRES_DB: geometastore
      POSTGRES_USER: geoai
      POSTGRES_PASSWORD: geoi_secure_pass_2024
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - geoai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoai"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================================================
  # OLLAMA - Local LLM
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: geoai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - geoai-network
    environment:
      - OLLAMA_HOST=0.0.0.0

  # =========================================================================
  # MLFLOW - ML Experiment Tracking
  # =========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: geoai-mlflow
    ports:
      - "5001:5000"
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--allowed-hosts", "*", "--cors-allowed-origins", "*"]
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_ALLOWED_HOSTS=*
      - MLFLOW_CORS_ALLOWED_ORIGINS=*
      - MLFLOW_backend_store_uri=postgresql://postgres:postgres@geoai-postgres:5432/mlflow
      - MLFLOW_ARTIFACT_ROOT=s3://mlflow-artifacts
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      - MLFLOW_S3_ENDPOINT_URL=http://geoai-minio:9000
    networks:
      - geoai-network
    depends_on:
      - postgres
      - minio

  # =========================================================================
  # METRICS EXPORTER - Separate Prometheus metrics
  # =========================================================================
  metrics-exporter:
    image: python:3.11-slim
    container_name: geoai-metrics
    command:
      - sh
      - -c
      - |
        pip install prometheus_client
        python /metrics_exporter.py
    volumes:
      - ./metrics_exporter.py:/metrics_exporter.py:ro
    ports:
      - "8888:8888"
    networks:
      - geoai-network

  # =========================================================================
  # PROMETHEUS - Monitoring
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: geoai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - geoai-network
    depends_on:
      - metrics-exporter

  # =========================================================================
  # GRAFANA - Visualization
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: geoai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - geoai-network
    depends_on:
      - prometheus

networks:
  geoai-network:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  ollama-data:
  mlflow-data:
  grafana-data: