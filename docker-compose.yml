# =============================================================================
# GeoAI Medallion Architecture - Local Development Stack
# =============================================================================

services:
  # =========================================================================
  # MINIO - Object Storage
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: geoai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - geoai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================================================
  # SPARK (Local Standalone)
  # =========================================================================
  spark:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: geoai-spark
    environment:
      SPARK_MODE: master
      SPARK_MASTER_PORT: 7077
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      S3_ENDPOINT: http://minio:9000
    ports:
      - "9077:7077"
      - "9080:8080"
      - "4040:4040"
    volumes:
      - ./src:/home/jovyan/src
      - ./tests:/home/jovyan/tests
    networks:
      - geoai-network
    depends_on:
      - minio

  # =========================================================================
  # POSTGRESQL - Metastore
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: geoai-postgres
    environment:
      POSTGRES_DB: geometastore
      POSTGRES_USER: geoai
      POSTGRES_PASSWORD: geoi_secure_pass_2024
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - geoai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoai"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================================================
  # OLLAMA - Local LLM
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: geoai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - geoai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  geoai-network:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  ollama-data: