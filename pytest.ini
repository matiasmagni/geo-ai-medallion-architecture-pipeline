# =============================================================================
# Pytest Configuration for GeoAI Medallion Architecture
# =============================================================================
# Pytest INI file for configuring test execution

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = 
    tests/L0.py
    tests/L1.py
    tests/L2.py
    tests/L3.py

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for test levels
markers =
    L0: L0 Unit tests (configuration, utilities)
    L1: L1 Integration tests (component integration)
    L2: L2 Pipeline tests (ELT pipeline stages)
    L3: L3 E2E tests (end-to-end system tests)
    slow: Slow running tests
    integration: Tests requiring external services

# Timeout (seconds)
timeout = 300

# Coverage settings
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */conda/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

# Coverage report output
[coverage:html]
directory = htmlcov